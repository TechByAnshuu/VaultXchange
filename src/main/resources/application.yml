server:
  # Render injects PORT automatically; fallback to 8082 for local dev
  port: ${PORT:8082}

spring:
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      # Set MONGO_URI env var in Render dashboard and local .env
      uri: ${MONGO_URI}
      database: banking_sim
      # Enables @Indexed(unique=true) on Account.accountNumber
      auto-index-creation: true

logging:
  level:
    root: INFO
    # Enable debug logging for our own package to trace flow
    com.bank: DEBUG
    org.springframework.data.mongodb: DEBUG
