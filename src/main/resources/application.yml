server:
  # Render injects PORT automatically; fallback to 8082 for local dev
  port: ${PORT:8082}

spring:
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      # Supports both MONGO_URI (new) and MONGODB_URI (old/fallback)
      uri: ${MONGO_URI:${MONGODB_URI:}}
      database: banking_sim
      # Enables @Indexed(unique=true) on Account.accountNumber
      auto-index-creation: true

  # Gmail SMTP — credentials sourced from .env, never hardcoded
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Low-balance and high-amount alert thresholds
app:
  alert:
    threshold: ${ALERT_THRESHOLD:1000}
    amount-threshold: ${ALERT_AMOUNT_THRESHOLD:5000}

logging:
  level:
    root: INFO
    # Enable debug logging for our own package to trace flow
    com.bank: DEBUG
    org.springframework.data.mongodb: DEBUG
