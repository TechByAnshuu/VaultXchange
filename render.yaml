services:
  - type: web
    name: vaultxchange-backend
    env: java
    # Render auto-detects Java via pom.xml — no runtime config needed
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/BankingApplication-0.0.1-SNAPSHOT.jar
    # Health check — Render pings this to confirm the app started
    healthCheckPath: /api/accounts
    envVars:
      # Paste your full Atlas connection string in the Render dashboard (never commit this)
      - key: MONGODB_URI
        sync: false
      # Render injects PORT automatically — spring.server.port reads ${PORT:8082}
      - key: PORT
        value: 8082
      # Force Java 17 — must match the java.version in pom.xml
      - key: JAVA_VERSION
        value: 17
      # Set your deployed Vercel URL here after frontend is live
      - key: FRONTEND_URL
        value: https://vaultxchange.vercel.app
